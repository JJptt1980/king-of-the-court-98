<title>單挑之王 98</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 1990s desktop-OS minimalism. One narrow column of 1-bit "windows" on a dithered desk:
   black hairlines, hard offset shadows, striped title bars, inverted selection.
   Color lives in one place only: the gold LED scoreboard, matched to the CLUTCH SQUAD crest. */
:root{
  --desk:#C9C9C9; --desk-dot:#B4B4B4;
  --paper:#FFFFFF; --face:#F2F2F2; --ink:#000000; --muted:#5E5E5E; --rule:#000000; --soft:#BDBDBD;
  --led-bg:#0A0A0A; --led:#F5C400; --led-dim:#2E2700; --led-2:#F4F4F4;
  --bad:#C00000; --good:#000000;
  --f-pixel:"Silkscreen","VT323",ui-monospace,monospace;
  --f-led:"VT323",ui-monospace,"Menlo",monospace;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --shadow:3px 3px 0 var(--ink);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#161616; --desk-dot:#222222;
  --paper:#000000; --face:#111111; --ink:#EDEDED; --muted:#9A9A9A; --rule:#EDEDED; --soft:#444444;
  --led-bg:#000000; --led:#F5C400; --led-dim:#2E2700; --led-2:#F4F4F4;
  --bad:#FF5A4E; --good:#EDEDED; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#161616; --desk-dot:#222222;
  --paper:#000000; --face:#111111; --ink:#EDEDED; --muted:#9A9A9A; --rule:#EDEDED; --soft:#444444;
  --led-bg:#000000; --led:#F5C400; --led-dim:#2E2700; --led-2:#F4F4F4;
  --bad:#FF5A4E; --good:#EDEDED; color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--desk);background-image:radial-gradient(var(--desk-dot) 1px,transparent 1.2px);background-size:4px 4px;
  color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-block:14px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;border-radius:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px dotted var(--ink);outline-offset:2px}
.num{font-family:var(--f-led);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted)}

/* ---- menu bar ---- */
header{display:flex;align-items:stretch;justify-content:space-between;gap:0;flex-wrap:wrap;background:var(--paper);border:2px solid var(--rule);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;padding:6px 12px;min-width:0}

.brand h1{font-size:18px;font-weight:900;margin:0;line-height:1}
.brand .v98{font-family:var(--f-led);font-size:24px;font-weight:400;color:var(--ink);letter-spacing:0;vertical-align:-2px}
.brand > span{font-family:var(--f-pixel);font-size:11px;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.tabs{display:flex;border-left:2px solid var(--rule)}
.tabs button{padding:6px 14px;font-weight:700;font-size:14px;border-left:1px solid var(--rule)}
.tabs button:first-child{border-left:0}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}

/* ---- windows ---- */
.panel{background:var(--paper);border:2px solid var(--rule);box-shadow:var(--shadow);padding:0 14px 14px;display:flex;flex-direction:column;gap:14px}
.panel > h2,.panel > .row:first-child{margin:0 -14px;padding:5px 10px;border-bottom:2px solid var(--rule);background:var(--paper)}
.panel h2{font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px;flex:1;min-width:0;white-space:nowrap}
.panel h2::before,.panel h2::after{content:"";flex:1;height:9px;min-width:12px;
  background:repeating-linear-gradient(to bottom,var(--ink) 0 1px,transparent 1px 3px)}
.panel h2::before{flex:0 0 14px}
.panel > .row:first-child{gap:8px;flex-wrap:nowrap}
.panel > .row:first-child > .hint,.panel > .row:first-child > .row{flex:none;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel > .row:first-child > .row{max-width:none;flex-wrap:wrap;white-space:normal}
.panel > .row:first-child:has(> .row){flex-wrap:wrap}
.panel > .row:first-child:has(> .row) > h2{min-width:8.5em}
.panel > .row:first-child:has(> .row) > .row{padding-bottom:2px}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:8px}
.field > label,.field > .lab{font-weight:700;font-size:14px}

/* ---- controls ---- */
.btn{padding:8px 16px;min-height:44px;border:2px solid var(--rule);border-radius:7px;background:var(--paper);font-weight:700;font-size:15px}
.btn:active{background:var(--ink);color:var(--paper)}
.btn.primary{font-weight:900;box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--rule);margin:4px}
.btn.court{background:var(--ink);color:var(--paper)}
.btn.court:active{background:var(--paper);color:var(--ink)}
.btn.ghost{border-color:transparent;text-decoration:underline;text-underline-offset:3px}
.btn.small{padding:4px 12px;min-height:34px;font-size:14px;border-radius:6px}
.btn.block{width:calc(100% - 8px)}
.btn:disabled{color:var(--soft);border-color:var(--soft);cursor:not-allowed;background:var(--paper)}
.btn.court:disabled{background:var(--soft);color:var(--paper)}

.seg{display:flex;flex-wrap:wrap;gap:0;border:2px solid var(--rule);width:max-content;max-width:100%}
.seg button{padding:7px 12px;min-height:40px;font-weight:700;border-left:1px solid var(--rule);background:var(--paper)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg .num{font-size:24px;line-height:1}

input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--rule);border-radius:0;padding:8px 10px;min-height:42px;min-width:0;box-shadow:inset 2px 2px 0 var(--soft)}
textarea{resize:vertical;width:100%}

.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{width:26px;height:26px;border:2px solid var(--rule);background:var(--paper);flex:none;position:relative}
.switch[aria-checked="true"]{background:
  linear-gradient(45deg,transparent calc(50% - 1.5px),var(--ink) calc(50% - 1.5px) calc(50% + 1.5px),transparent calc(50% + 1.5px)),
  linear-gradient(-45deg,transparent calc(50% - 1.5px),var(--ink) calc(50% - 1.5px) calc(50% + 1.5px),transparent calc(50% + 1.5px)),var(--paper)}

/* ---- lists ---- */
.plist{display:flex;flex-direction:column;margin:0;padding:0;list-style:none;border:2px solid var(--rule)}
.plist li{display:flex;align-items:center;gap:8px;padding:2px 4px 2px 10px;border-top:1px solid var(--rule);min-height:42px}
.plist li:first-child{border-top:0}
.plist .idx{font-family:var(--f-led);font-size:22px;width:26px;color:var(--muted)}
.plist .nm-in{flex:1;font-weight:700;background:transparent;border:0;box-shadow:none;padding:4px 6px;min-height:34px}
.plist .nm-in:focus{background:var(--ink);color:var(--paper);outline:none}
.role{font-family:var(--f-pixel);font-size:10px;padding:2px 6px;border:1px solid var(--rule)}
.role.off{background:var(--ink);color:var(--paper)}
.role.def{background:var(--paper);color:var(--ink)}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;font-size:16px;font-weight:700}
.icon-btn:hover{background:var(--ink);color:var(--paper)}
.icon-btn:disabled{color:var(--soft);background:none;cursor:default}

.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.grp{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:8px 10px;border:2px solid var(--rule);background:var(--paper);text-align:left;min-width:0;position:relative}
.grp::before{content:"";position:absolute;left:-2px;top:-8px;width:44px;height:8px;border:2px solid var(--rule);border-bottom:0;background:inherit}
.grp .gn{font-weight:900;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp .gc{font-family:var(--f-pixel);font-size:10px;color:var(--muted)}
.grp[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.grp[aria-pressed="true"] .gc{color:var(--paper)}
.grp.add-grp{align-items:center;justify-content:center;border-style:dashed;font-weight:700;color:var(--muted)}
.grp.add-grp::before{display:none}
.groups{padding-top:8px}
.grp-detail{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--rule);padding-top:12px}
.grp-detail .hint{min-width:0;overflow-wrap:anywhere}

/* ---- LED scoreboard: the one place with color ---- */
.board{background:var(--led-bg);color:var(--led-2);border:2px solid var(--rule);box-shadow:var(--shadow);padding:0;display:flex;flex-direction:column;position:relative}
.board::before{content:"SCOREBOARD";display:block;font-family:var(--f-pixel);font-size:11px;letter-spacing:.2em;color:var(--paper);background:var(--ink);padding:4px 10px;border-bottom:2px solid var(--rule)}
:root[data-theme="dark"] .board::before{color:#000}
.matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:6px;padding:12px 14px 6px;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.3px);background-size:5px 5px}
.side{min-width:0;display:flex;flex-direction:column;gap:2px}
.side.right{text-align:right;align-items:flex-end}
.side .tag{font-family:var(--f-pixel);font-size:10px;letter-spacing:.08em;color:#9A9A9A}
.side .who{font-size:19px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.side .pts{font-family:var(--f-led);font-size:104px;line-height:.78;color:var(--led);text-shadow:0 0 14px rgba(245,196,0,.45);font-variant-numeric:tabular-nums}
.side.right .pts{color:var(--led-2);text-shadow:0 0 10px rgba(255,255,255,.25)}
.vs{font-family:var(--f-pixel);font-size:12px;color:#777;padding-bottom:14px}
.streak{font-family:var(--f-pixel);font-size:10px;color:var(--led);border:1px solid var(--led);padding:1px 6px;width:max-content;margin-top:6px}
.progress{height:8px;margin:6px 14px 0;background:var(--led-dim);border:1px solid #333}
.progress i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--led) 0 6px,transparent 6px 8px);transition:width .25s}
.call{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:#BDBDBD;padding:10px 14px 12px}
.call b{color:var(--led-2);font-weight:900}
.call .num{color:var(--led)!important;font-size:20px!important}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-weight:900;font-size:17px;border:2px solid var(--rule);box-shadow:var(--shadow);background:var(--paper);color:var(--ink);transition:transform .05s}
.act:active{transform:translate(3px,3px);box-shadow:none}
.act small{font-size:12px;font-weight:500;color:inherit;opacity:.75}
.act .big{font-family:var(--f-led);font-size:52px;line-height:.8;font-weight:400}
.act.make{background:var(--ink);color:var(--paper)}
.act.viol{color:var(--bad)}
.act.wide{grid-column:1 / -1}

.dribble{display:flex;align-items:center;gap:12px;background:var(--paper);border:2px solid var(--rule);box-shadow:var(--shadow);padding:8px 10px}
.dots{display:flex;gap:6px;flex:1}
.dots i{width:20px;height:20px;border:2px solid var(--rule);border-radius:50%}
.dots i.on{background:var(--ink)}
.dribble.over{background:repeating-linear-gradient(45deg,var(--paper) 0 6px,var(--face) 6px 12px)}
.dribble .lbl{font-weight:900;font-size:14px}
.dribble .shout{font-family:var(--f-pixel);font-weight:700;color:var(--bad);font-size:13px}

.queue{display:flex;flex-direction:column;margin:0;padding:0;list-style:none;border:2px solid var(--rule)}
.queue li{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:5px 10px;border-top:1px solid var(--rule)}
.queue li:first-child{border-top:0}
.queue .pos{font-family:var(--f-led);font-size:22px;color:var(--muted)}
.queue .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.queue .sc{font-family:var(--f-led);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.queue li.off{background:var(--ink);color:var(--paper)}
.queue li.off .pos,.queue li.off .hint{color:var(--paper)}
.queue li.def{background:repeating-linear-gradient(to bottom,var(--paper) 0 2px,var(--face) 2px 4px)}

.log{display:flex;flex-direction:column;max-height:240px;overflow:auto;margin:0;padding:0;list-style:none;font-size:14px;border:2px solid var(--rule);box-shadow:inset 2px 2px 0 var(--soft)}
.log li{display:flex;gap:10px;padding:4px 8px;border-top:1px dotted var(--soft)}
.log li:first-child{border-top:0}

.brand > span{display:none}}

<div class="wrap" id="app"></div>
<div id="layer"></div>

<script>
(function(){
const KEY='kotc-v1';
const SPOT_SETS={
  elbow:['罰球線頂端','左肘區','右肘區'],
  arc:['弧頂','左翼 45°','右翼 45°'],
  none:[]
};
const MAX_PLAYERS=100;
// ROSTER_VAULT_START (generated by scripts/encrypt-rosters.mjs; do not edit by hand)
const ROSTER_VAULT=[{"s":"nral7zOBkhpw6ZXMh/P0jQ==","v":"3WAw7KF9y/HFGZ9y","c":"mEiTww3nJT0867H9EVL1XwZm8YpLEGnneykmI/MHWjJFigsfAeL0h5UjOXTajkKSm6GHU6D+tn8kb+K9ciWaHkiXL5uJ2L6d/EZVtfBab3jPiDE7cq2ERA6JAh5QpapoL+ZXBXS1LQka60bsfLz6SwSyUpAFWAUnJ52u16Z3/nqQSW5W4IdJlmYVWgG25ixblM654CGphezQYk2ZBJV0vII=","i":300000}];
// ROSTER_VAULT_END
async function unlockRoster(code){
  try{
    if(!/^[A-Z0-9]{4,24}$/.test(code)||!ROSTER_VAULT.length||!(window.crypto&&crypto.subtle))return null;
    const te=new TextEncoder(),b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
    const base=await crypto.subtle.importKey('raw',te.encode(code),'PBKDF2',false,['deriveKey']);
    for(const v of ROSTER_VAULT){
      try{
        const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(v.s),iterations:v.i,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
        const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(v.v)},key,b64(v.c));
        const names=JSON.parse(new TextDecoder().decode(pt));if(Array.isArray(names))return names;
      }catch(e){}
    }
  }catch(e){}
  return null;
}
let uid=()=>Math.random().toString(36).slice(2,9);
const defaults=n=>Array.from({length:n},(_,i)=>({id:uid(),name:'球員 '+(i+1)}));
function nextDefaultName(){let i=1;while(S.players.some(p=>p.name==='球員 '+i))i++;return '球員 '+i}
const defaultGroups=()=>[1,2,3].map(i=>({id:uid(),name:'自訂 '+i,players:[]}));
function nextGroupName(){let i=1;while(S.groups.some(g=>g.name==='自訂 '+i))i++;return '自訂 '+i}
const nativeTTS=()=>{try{return window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()&&window.Capacitor.Plugins&&window.Capacitor.Plugins.TextToSpeech}catch(e){return null}};
const canSpeak=(()=>{try{return !!nativeTTS()||('speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined')}catch(e){return false}})();

let S=load()||{
  settings:{target:12,scoring:'split',dribbles:3,spots:'elbow',penalty:false,voice:false},
  players:defaults(5),
  game:null,
  history:[]
};
if(S.example){S.players=defaults(5);delete S.example}
if(!S.groups)S.groups=defaultGroups();
if(S.players.every((p,i)=>p.name==='自訂 '+(i+1)))S.players.forEach((p,i)=>p.name='球員 '+(i+1));
let view='home';
let ui={confirm:null,dribble:0,toast:null,paste:false,group:null,renaming:false};

function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
function nameOf(id){const g=S.game;const p=(g?g.roster:S.players).find(p=>p.id===id);return p?p.name:'?'}
function fmtTime(ms){const s=Math.max(0,Math.round(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=String(s%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+ss:m+':'+ss}
function fmtDate(t){const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}

/* ---------- game engine ---------- */
function newStats(){return {pts:0,makes:0,poss:0,viol:0,stops:0,streak:0,best:0}}
function startGame(order){
  const roster=order.map(id=>S.players.find(p=>p.id===id)).filter(Boolean).map(p=>({...p}));
  const g={id:uid(),start:Date.now(),rules:{...S.settings},roster,order:roster.map(p=>p.id),
    scores:{},stats:{},spotIdx:0,log:[],undo:[],done:false};
  roster.forEach(p=>{g.scores[p.id]=0;g.stats[p.id]=newStats()});
  S.game=g;ui.dribble=0;view='game';save();wake();announce();
}
function snapshot(g){const {undo,...rest}=g;return JSON.stringify(rest)}
function play(type,pts){
  const g=S.game;if(!g||g.done)return;
  g.undo.push(snapshot(g));if(g.undo.length>60)g.undo.shift();
  const [off,def,...q]=g.order;
  const so=g.stats[off],sd=g.stats[def];
  so.poss++;
  const ev={t:Date.now()-g.start,off,def,type,pts:0,spot:curSpot(g)};
  if(type==='make'){
    g.scores[off]+=pts;so.pts+=pts;so.makes++;so.streak++;so.best=Math.max(so.best,so.streak);ev.pts=pts;
    g.order=q.length?[off,...q,def]:[off,def];
  }else{
    so.streak=0;
    if(type==='viol'){so.viol++;if(g.rules.penalty&&g.scores[off]>0){g.scores[off]--;ev.pts=-1}}
    sd.stops++;
    g.order=q.length?[def,...q,off]:[def,off];
  }
  ev.score=g.scores[off];
  g.log.push(ev);g.spotIdx++;ui.dribble=0;
  if(type==='make'&&g.scores[off]>=g.rules.target){finish(off)}
  save();render();
  if(!g.done)announce();
}
function undo(){
  const g=S.game;if(!g||!g.undo.length)return;
  const prev=JSON.parse(g.undo.pop());
  const u=g.undo;S.game={...prev,undo:u};
  if(prev.done===false&&g.done){S.history=S.history.filter(h=>h.id!==g.id)}
  ui.dribble=0;save();render();toast('已復原上一球');
}
function curSpot(g){const set=SPOT_SETS[g.rules.spots]||[];return set.length?set[g.spotIdx%set.length]:''}
function finish(winner){
  const g=S.game;g.done=true;g.winner=winner;g.end=Date.now();
  const rec=recordOf(g,winner);
  saveRecord(rec);
  g.quote=QUOTES[Math.floor(Math.random()*QUOTES.length)];
  g.winStreak=winStreakOf(nameOf(winner));
  g.rewards=rewardsFor(g,winner);
  rec.winStreak=g.winStreak;rec.quote=g.quote;rec.rewards=g.rewards.map(({say,...r})=>r);
  const top=g.rewards[0];
  speak(nameOf(winner)+' 拿到 '+g.scores[winner]+' 分，單挑之王！'+(top?top.say:''));
}
function recordOf(g,winner){
  return {id:g.id,start:g.start,end:g.end||Date.now(),rules:g.rules,winner,
    players:g.roster.map(p=>({id:p.id,name:p.name,score:g.scores[p.id],...g.stats[p.id]})),
    possessions:g.log.length,log:g.log.map(e=>({...e}))};
}
function saveRecord(rec){S.history=S.history.filter(h=>h.id!==rec.id);S.history.unshift(rec);S.history=S.history.slice(0,500)}
// End a game before anyone reaches the target. record=true keeps it (no winner) for stats and the daily summary.
function endEarly(record){
  const g=S.game;
  if(g&&!g.done&&record&&g.log.length){const rec=recordOf(g,null);rec.unfinished=true;saveRecord(rec)}
  S.game=null;ui.confirm=null;view='home';save();render();
  if(g&&record&&g.log.length)toast('已記錄為未完成，會算進今日總結');
}
const winnerName=h=>{const p=h.players.find(p=>p.id===h.winner);return p?p.name:''};
function winStreakOf(name){let n=0;for(const h of S.history){if(h.unfinished)continue;if(winnerName(h)===name)n++;else break}return n}

/* ---------- 心靈雞湯 + 獎勵 ---------- */
const QUOTES=[
  '冠軍不是贏一次，是每天都回來練。',
  '今天流的汗，是明天出手的底氣。',
  '敢出手的人，才有資格進球。',
  '三運之內決勝負，人生也一樣，別猶豫。',
  '被蓋過的球，都會變成你下一次的假動作。',
  '贏了別飄，明天還有人排隊挑戰你。',
  '腳步紮實，籃框就會變大。',
  '最難守的對手，是昨天的自己。',
  '每一次沒進，都是在排隊等下一次機會。',
  '場上沒有運氣，只有準備好的第一步。',
  '先拿下下一球，再談下一場。',
  '王座不是用坐的，是用守的。',
  '練到不用想，關鍵時刻才不會慌。',
  '投進是結果，敢投是態度。',
  '慢慢來比較快，基本功永遠不會背叛你。',
  '你不必每球都進，只要每球都認真。'
];
const STREAK_TIERS=[
  {n:7,title:'傳奇',en:'LEGEND',text:'連贏 7 場以上，這座球場從今天起寫你的名字。'},
  {n:5,title:'球場之王',en:'KING OF THE COURT',text:'5 連勝！大家排隊，就是為了打倒你。'},
  {n:4,title:'主宰',en:'DOMINATOR',text:'4 連勝，對手換了一輪，王座還是你的。'},
  {n:3,title:'三連霸',en:'THREE-PEAT',text:'3 連勝，手感燙到可以煎蛋。'},
  {n:2,title:'熱手',en:'HOT HAND',text:'2 連勝，火已經點起來了，別讓它熄。'}
];
function rewardsFor(g,w){
  const r=[],st=g.stats[w],n=g.winStreak||1;
  const tier=STREAK_TIERS.find(t=>n>=t.n);
  if(tier)r.push({big:true,label:n+' 連勝',title:tier.title,en:tier.en,text:tier.text,say:' '+n+' 連勝，'+tier.title+'！'});
  if(st.best>=5)r.push({label:'連進 '+st.best+' 球',title:'無人能擋',en:'UNSTOPPABLE',text:'一口氣連進 '+st.best+' 球，防守者只能目送。',say:' 連進 '+st.best+' 球，無人能擋！'});
  if(st.poss>=4&&st.makes===st.poss)r.push({label:st.makes+' 投 '+st.makes+' 中',title:'完美比賽',en:'PERFECT GAME',text:'這場一球都沒失手。',say:' 完美比賽！'});
  const others=g.roster.filter(p=>p.id!==w);
  if(others.length&&others.every(p=>g.scores[p.id]===0))r.push({label:'對手全掛蛋',title:'完封',en:'SHUTOUT',text:'其他人一分都拿不到。',say:' 完封！'});
  return r;
}

/* ---------- 每日總結 ---------- */
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function daySummary(key){
  const games=S.history.filter(h=>dayKey(h.start)===key).sort((a,b)=>a.start-b.start);
  if(!games.length)return null;
  const P={};
  let run={name:'',n:0},bestRun={name:'',n:0};
  games.forEach(h=>{
    if(!h.unfinished){const wn=winnerName(h);
    if(wn===run.name)run.n++;else run={name:wn,n:1};
    if(run.n>bestRun.n)bestRun={...run};}
    h.players.forEach(p=>{const a=P[p.name]||(P[p.name]={name:p.name,games:0,wins:0,pts:0,makes:0,poss:0,best:0,stops:0});
      if(!h.unfinished)a.games++;if(p.id===h.winner)a.wins++;a.pts+=p.pts;a.makes+=p.makes;a.poss+=p.poss;a.best=Math.max(a.best,p.best);a.stops+=p.stops});
  });
  const list=Object.values(P);
  const top=(f,min)=>{const c=list.filter(x=>!min||x.poss>=min).sort((a,b)=>f(b)-f(a));return c.length&&f(c[0])>0?c[0]:null};
  const mvp=[...list].sort((a,b)=>b.wins-a.wins||b.pts-a.pts)[0];
  const playMs=games.reduce((s,h)=>s+(h.end-h.start),0);
  const awards=[
    mvp&&mvp.wins?{k:'今日 MVP',who:mvp.name,v:mvp.wins+' 勝 / '+mvp.games+' 場'}:null,
    (x=>x&&{k:'得分王',who:x.name,v:x.pts+' 分'})(top(x=>x.pts)),
    bestRun.n>=2?{k:'最長連勝',who:bestRun.name,v:bestRun.n+' 連勝'}:null,
    (x=>x&&{k:'最長連進',who:x.name,v:x.best+' 球'})(top(x=>x.best)),
    (x=>x&&{k:'神準手',who:x.name,v:Math.round(x.makes/x.poss*100)+'%（'+x.makes+'/'+x.poss+'）'})(top(x=>x.makes/x.poss,5)),
    (x=>x&&{k:'防守大鎖',who:x.name,v:x.stops+' 次'})(top(x=>x.stops)),
    (x=>x&&{k:'鐵人',who:x.name,v:x.poss+' 次進攻'})(top(x=>x.poss))
  ].filter(Boolean);
  const seed=key.split('-').reduce((s,x)=>s+ +x,0);
  return {key,games,unfinished:games.filter(h=>h.unfinished).length,list:list.sort((a,b)=>b.wins-a.wins||b.pts-a.pts),awards,playMs,
    span:[games[0].start,games[games.length-1].end],poss:games.reduce((s,h)=>s+h.possessions,0),
    quote:QUOTES[seed%QUOTES.length]};
}
function dayLabel(key){return key===dayKey(Date.now())?'今天':key.slice(5).replace('-','/')}
function dayText(d){
  const hm=t=>{const x=new Date(t);return String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0')};
  return ['單挑之王 98・'+d.key+' 總結',
    d.games.length+' 場'+(d.unfinished?'（含 '+d.unfinished+' 場未完成）':'')+'・'+d.poss+' 球・打了 '+fmtTime(d.playMs)+'（'+hm(d.span[0])+'–'+hm(d.span[1])+'）','',
    ...d.awards.map(a=>a.k+'：'+a.who+'　'+a.v),'',
    '戰績：',...d.list.map(p=>p.name+' '+p.wins+' 勝 '+p.games+' 場・'+p.pts+' 分'),'',
    '「'+d.quote+'」'].join('\n');
}
function abandon(){endEarly(false)}
function rematch(){
  const g=S.game;if(!g)return;
  // winner attacks first, the rest keep the order of their final scores (lowest defends first)
  const rest=g.roster.map(p=>p.id).filter(id=>id!==g.winner).sort((a,b)=>g.scores[a]-g.scores[b]);
  S.players=g.roster.map(p=>({...p}));
  startGame([g.winner,...rest]);render();
}

/* ---------- voice + wake lock ---------- */
function speak(text){
  if(!S.settings.voice)return;
  const tts=nativeTTS();
  if(tts){tts.stop().catch(()=>{}).then(()=>tts.speak({text,lang:'zh-TW',rate:1.05})).catch(()=>{});return}
  try{const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=1.05;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
function announce(){
  const g=S.game;if(!g||g.done)return;
  const [off,def]=g.order;const spot=curSpot(g);
  speak(nameOf(off)+' '+g.scores[off]+' 分，'+nameOf(def)+' 防守'+(spot?'，'+spot:''));
}
let lock=null;
async function wake(){try{if('wakeLock' in navigator&&!lock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>lock=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.game&&!S.game.done)wake()});

function toast(msg){ui.toast=msg;renderLayer();clearTimeout(toast._t);toast._t=setTimeout(()=>{ui.toast=null;renderLayer()},1600)}

/* ---------- render ---------- */
function render(){
  const app=$('app');
  const tabs=`<header>
    <div class="brand"><h1>單挑之王 <span class="v98">98</span></h1><span>KING OF THE COURT</span></div>
    <nav class="tabs" role="tablist">
      <button role="tab" aria-selected="${view==='home'}" data-act="view" data-v="home">首頁</button>
      ${S.game?`<button role="tab" aria-selected="${view==='game'}" data-act="view" data-v="game">${S.game.done?'比賽':'比賽中'}</button>`:''}
      <button role="tab" aria-selected="${view==='stats'}" data-act="view" data-v="stats">戰績</button>
    </nav></header>`;
  let body='';
  if(view==='game'&&!S.game)view='home';
  if(view==='stats')body=renderStats();

function renderGame(){
  const g=S.game,r=g.rules;
  const [off,def,...q]=g.order;
  const so=g.stats[off];
  const spot=curSpot(g);
  const pct=Math.min(100,g.scores[off]/r.target*100);
  const lead=[...g.order].sort((a,b)=>g.scores[b]-g.scores[a])[0];
  const makeBtns=r.scoring==='split'
    ?`<button class="act make" data-act="make" data-p="1"><span class="big">+1</span>進球<small>三分線內</small></button>
      <button class="act make" data-act="make" data-p="2"><span class="big">+2</span>進球<small>三分線外</small></button>`

      ${ui.dribble>=dr?`<span class="shout">${ui.dribble>dr?'超次！':'收！'}</span>`:`<span class="hint">點圓點計數</span>`}

          <span class="who">${esc(nameOf(off))}</span>
          <span class="pts">${g.scores[off]}</span>
          ${so.streak>=2?`<span class="streak">連進 ${so.streak} 球</span>`:''}

          <span class="tag">挑戰者・防守</span>

      <button class="act miss" data-act="miss">沒進<small>防守者上來進攻</small></button>
      <button class="act viol" data-act="viol">失誤${r.penalty?' −1':''}<small>運球超次・走步・被抄</small></button>
    </div>
    ${dribbleBar}`}

      <button class="btn" data-act="undo" ${g.undo.length?'':'disabled'}>↶ 復原上一球</button>

        e.type==='make'?`<span class="ok">進 +${e.pts}</span>`:e.type==='viol'?`<span class="bad">失誤${e.pts<0?' −1':''}</span>`:`<span class="no">沒進</span>`

function statTable(rows,winner){
  rows=[...rows].sort((a,b)=>b.score-a.score);
  return `<div class="tbl-wrap"><table>
    <thead><tr><th>球員</th><th>得分</th><th>進/攻</th><th>命中</th><th>最長連進</th><th>防守成功</th><th>失誤</th></tr></thead>
    <tbody>${rows.map(r=>`<tr class="${r.id===winner?'win':''}"><td class="n">${esc(r.name)}</td><td><b>${r.score}</b></td><td>${r.makes}/${r.poss}</td>
      <td>${r.poss?Math.round(r.makes/r.poss*100)+'%':'—'}</td><td>${r.best}</td><td>${r.stops}</td><td>${r.viol}</td></tr>`).join('')}</tbody>
  </table></div>`;
}

function renderStats(){
  const H=S.history;
  if(!H.length)return `<section class="panel"><div class="empty"><b>還沒有完成的比賽</b>打完一場（有人拿到目標分數）就會出現在這裡，累積勝場、命中率和最長連進。</div></section>`;
  const agg={};
  H.forEach(h=>h.players.forEach(p=>{
    const k=p.name;const a=agg[k]||(agg[k]={name:k,games:0,wins:0,pts:0,makes:0,poss:0,best:0,stops:0,viol:0});
    if(!h.unfinished)a.games++;if(p.id===h.winner)a.wins++;a.pts+=p.pts;a.makes+=p.makes;a.poss+=p.poss;a.best=Math.max(a.best,p.best);a.stops+=p.stops;a.viol+=p.viol;
  }));
  const rate=r=>r.games?r.wins/r.games:0;
  const rows=Object.values(agg).sort((a,b)=>b.wins-a.wins||rate(b)-rate(a)||b.pts-a.pts);
  const days=[...new Set(H.map(h=>dayKey(h.start)))].sort().reverse();
  const dk=days.includes(ui.day)?ui.day:days[0];
  const d=daySummary(dk);const di=days.indexOf(dk);
  const hm=t=>{const x=new Date(t);return String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0')};
  const dayPanel=d?`<section class="panel day" id="today">
    <div class="row" style="justify-content:space-between"><h2>${dayLabel(dk)}總結</h2>
      <div class="row"><button class="btn small" data-act="dayNav" data-d="${di+1}" ${di+1>=days.length?'disabled':''} aria-label="前一天">◀</button>
      <span class="num" style="font-size:20px">${dk.slice(5).replace('-','/')}</span>
      <button class="btn small" data-act="dayNav" data-d="${di-1}" ${di<=0?'disabled':''} aria-label="後一天">▶</button></div></div>
    <div class="day-led"><div><b>${d.games.length}</b><span>場${d.unfinished?`（${d.unfinished} 場未完成）`:''}</span></div><div><b>${d.poss}</b><span>球</span></div><div><b>${fmtTime(d.playMs)}</b><span>${hm(d.span[0])}–${hm(d.span[1])}</span></div></div>
    <ul class="awards">${d.awards.map(a=>`<li><span class="ak">${a.k}</span><span class="aw">${esc(a.who)}</span><span class="av">${esc(a.v)}</span></li>`).join('')}</ul>
    <div class="tbl-wrap"><table style="min-width:0"><thead><tr><th>球員</th><th>勝/場</th><th>得分</th><th>命中</th><th>最長連進</th></tr></thead>
      <tbody>${d.list.map(p=>`<tr><td class="n">${esc(p.name)}</td><td><b>${p.wins}</b>/${p.games}</td><td>${p.pts}</td><td>${p.poss?Math.round(p.makes/p.poss*100)+'%':'—'}</td><td>${p.best}</td></tr>`).join('')}</tbody></table></div>
    <blockquote class="quote">${esc(d.quote)}</blockquote>
    <div class="row"><button class="btn court small" data-act="copyDay" data-k="${dk}">複製總結（貼到 LINE）</button></div>
  </section>`:'';
  return dayPanel+`<section class="panel">
    <div class="row" style="justify-content:space-between"><h2>排行榜</h2><span class="hint">${H.length} 場・以名字合併</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>球員</th><th>勝/場</th><th>勝率</th><th>總分</th><th>命中</th><th>最長連進</th><th>防守成功</th></tr></thead>
      <tbody>${rows.map((r,i)=>`<tr><td class="n">${i===0&&r.wins?'👑 ':''}${esc(r.name)}</td><td><b>${r.wins}</b>/${r.games}</td><td>${r.games?Math.round(rate(r)*100)+'%':'—'}</td>
        <td>${r.pts}</td><td>${r.poss?Math.round(r.makes/r.poss*100)+'%':'—'}</td><td>${r.best}</td><td>${r.stops}</td></tr>`).join('')}</tbody>
    </table></div>
  </section>
  <section class="panel">
    <div class="row" style="justify-content:space-between"><h2>歷史比賽</h2>
      <div class="row"><button class="btn small" data-act="copy">複製戰績</button><button class="btn small" data-act="export" data-kind="all">匯出全部每球紀錄</button><button class="btn small ghost" data-act="askClear">清除</button></div></div>
    ${ui.confirm==='clear'?`<div class="confirm"><b>刪除全部 ${H.length} 場紀錄？</b><span class="hint">刪了就找不回來。</span>
      <div class="row"><button class="btn small" data-act="cancel">保留</button><button class="btn small" style="color:var(--bad)" data-act="clearHist">全部刪除</button></div></div>`:''}
    <ul class="hist">${H.map(h=>{const w=h.players.find(p=>p.id===h.winner);const sorted=[...h.players].sort((a,b)=>b.score-a.score);
      return `<li><div class="top"><span class="w">${w?`👑 ${esc(w.name)} <span class="num" style="font-size:18px">${w.score}</span>`:'<span class="unf">未完成</span> '+esc(sorted[0].name)+' 領先'}</span><span class="meta">${fmtDate(h.start)}・${fmtTime(h.end-h.start)}</span></div>
      <div class="scores">${sorted.map(p=>`${esc(p.name)} <b>${p.score}</b>`).join('・')}</div>
      <div class="meta">搶 ${h.rules.target}・${h.rules.scoring==='split'?'1/2 分制':'全 1 分'}・${h.rules.dribbles?'限 '+h.rules.dribbles+' 運':'不限運'}${h.rules.penalty?'・失誤扣分':''}・${h.possessions} 球</div>
      ${(h.rewards||[]).length?`<div class="chips">${h.rewards.map(r=>`<span class="chip${r.big?' big':''}">${esc(r.title)}</span>`).join('')}</div>`:''}
      ${h.quote?`<div class="hq">「${esc(h.quote)}」</div>`:''}
      <div class="row">${w?`<button class="btn small" data-act="replay" data-id="${h.id}">▶ 重看勝利畫面</button>`:''}${h.log?`<button class="btn small" data-act="export" data-kind="hist" data-id="${h.id}">匯出每球紀錄</button>`:''}</div></li>`}).join('')}</ul>
  </section>`;
}

/* ---------- export ---------- */
const RESULT={make:'進球',miss:'沒進',viol:'失誤'};
function csvCell(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function gameRows(src){ // src: {start, players:[{id,name}], log}
  const nm=Object.fromEntries(src.players.map(p=>[p.id,p.name]));
  const d=new Date(src.start);const date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return (src.log||[]).map((e,i)=>[date,i+1,fmtTime(e.t),nm[e.off]||'?',nm[e.def]||'?',e.spot||'',RESULT[e.type]||e.type,e.pts>0?'+'+e.pts:e.pts<0?String(e.pts):'0',e.score]);
}
function buildExport(kind,id){
  const head=['比賽開始','球序','比賽時間','進攻','防守','開球點','結果','得分','進攻者累計'];
  let rows=[],name='';
  if(kind==='game'){const g=S.game;rows=gameRows({start:g.start,players:g.roster,log:g.log});name='這場'}
  else if(kind==='hist'){const h=S.history.find(x=>x.id===id);if(h){rows=gameRows(h);name=fmtDate(h.start)+' 那場'}}
  else{[...S.history].reverse().forEach(h=>rows.push(...gameRows(h)));name='全部 '+S.history.filter(h=>h.log).length+' 場'}
  const csv=[head,...rows].map(r=>r.map(csvCell).join(',')).join('\n');
  const stamp=new Date().toISOString().slice(0,10);
  return {csv,count:rows.length,name,file:'單挑之王-每球紀錄-'+stamp+'.csv'};
}
const STANDALONE=!!window.KOTC_STANDALONE;
const capShare=()=>{try{return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Share}catch(e){return null}};
const canShare=()=>!!capShare()||(STANDALONE&&!!navigator.share);
const canDownload=()=>STANDALONE&&!window.Capacitor;
async function doExport(how){
  const x=ui.export;if(!x)return;
  try{
    if(how==='copy'){await navigator.clipboard.writeText(x.csv);toast('已複製 '+x.count+' 球，可貼到 Excel 或 Google 試算表')}
    else if(how==='download'){const blob=new Blob(['﻿'+x.csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=x.file;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('已下載 '+x.file)}
    else if(how==='share'){const cs=capShare();if(cs)await cs.share({title:x.file,text:x.csv,dialogTitle:'分享每球紀錄'});else await navigator.share({title:x.file,text:x.csv})}
  }catch(e){
    if(e&&e.name==='AbortError')return;
    toast(how==='copy'?'無法自動複製，請長按下方文字全選複製':'沒有成功，請改用複製');
    const ta=$('exportBox');if(ta){ta.focus();ta.select()}
  }
}

function winBody(name,score,st,ms,rewards,quote){
  return `<div class="crown">KING OF THE COURT</div>
      <div class="name">${esc(name)}</div>
      <div class="final">${score}<small>分</small></div>
      <div class="facts">
        <div><b>${st.makes}/${st.poss}</b><span>進球/進攻</span></div>
        <div><b>${st.best}</b><span>最長連進</span></div>
        <div><b>${fmtTime(ms)}</b><span>比賽時間</span></div>
      </div>
      ${(rewards||[]).map(r=>`<div class="reward${r.big?' big':''}">
        <div class="rw-top"><span class="rw-label">${esc(r.label)}</span><span class="rw-en">${r.en}</span></div>
        <div class="rw-title">${esc(r.title)}</div><div class="rw-text">${esc(r.text)}</div></div>`).join('')}
      ${quote?`<blockquote class="quote">${esc(quote)}</blockquote>`:''}`;
}
function renderLayer(){
  const g=S.game;let html='';
  if(ui.export){const x=ui.export;
    html+=`<div class="overlay" role="dialog" aria-modal="true" aria-label="匯出每球紀錄"><div class="win-card" style="text-align:left">
      <div class="row" style="justify-content:space-between"><b style="font-size:18px">匯出每球紀錄</b><button class="icon-btn" aria-label="關閉" data-act="closeExport">×</button></div>
      <span class="hint">${esc(x.name)}・共 ${x.count} 球・CSV 格式，可直接貼到 Excel、Numbers 或 Google 試算表。</span>
      <textarea id="exportBox" rows="8" readonly style="font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre">${esc(x.csv)}</textarea>
      <div class="row">
        <button class="btn primary small" data-act="expDo" data-how="copy">複製</button>
        ${canDownload()?`<button class="btn court small" data-act="expDo" data-how="download">下載 .csv</button>`:''}
        ${canShare()?`<button class="btn court small" data-act="expDo" data-how="share">分享到 LINE 等</button>`:''}
      </div>
    </div></div>`;
  }
  if(g&&g.done&&ui.showWin!==false){
    const w=g.winner,st=g.stats[w];
    html+=`<div class="overlay" role="dialog" aria-modal="true" aria-label="比賽結果"><div class="win-card">
      ${winBody(nameOf(w),g.scores[w],st,g.end-g.start,g.rewards,g.quote)}
      <button class="btn go block" data-act="rematch">▶ 再來一場（${esc(nameOf(w))} 先攻）</button>
      <div class="row" style="justify-content:center">
        <button class="btn small" data-act="undo">↶ 記錯了，復原</button>
        <button class="btn small" data-act="toSetup">回到設定</button>
        <button class="btn small" data-act="toToday">今日總結</button>
        <button class="btn small ghost" data-act="hideWin">看這場數據</button>
      </div>
    </div></div>`;
  }
  const rp=ui.replay&&S.history.find(h=>h.id===ui.replay);
  if(rp){const w=rp.players.find(p=>p.id===rp.winner);
    html+=`<div class="overlay" role="dialog" aria-modal="true" aria-label="重看勝利畫面"><div class="win-card">
      <div class="replay-date">${fmtDate(rp.start)} 的比賽・重播</div>
      ${winBody(w.name,w.score,w,rp.end-rp.start,rp.rewards,rp.quote)}
      <div class="row" style="justify-content:center">
        <button class="btn go" data-act="closeReplay">關閉</button>
        <button class="btn small" data-act="export" data-kind="hist" data-id="${rp.id}">匯出這場每球紀錄</button>
      </div></div></div>`;}
  if(ui.toast)html+=`<div class="toast" role="status">${esc(ui.toast)}</div>`;
  $('layer').innerHTML=html;
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,st=S.settings;
  switch(a){
    case 'view':view=b.dataset.v;ui.confirm=null;break;
    case 'set':{const k=b.dataset.k;let v=b.dataset.v;if(k==='target'||k==='dribbles')v=+v;st[k]=v;break}
    case 'tog':st[b.dataset.k]=!st[b.dataset.k];if(b.dataset.k==='voice'&&st.voice){save();speak('語音報分已開啟')}break;
    case 'rm':S.players.splice(+b.dataset.i,1);break;
    case 'up':{const i=+b.dataset.i;const p=S.players;[p[i-1],p[i]]=[p[i],p[i-1]];break}
    case 'shuffle':{const p=S.players;for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}break}
    case 'pickGroup':{
      const g=S.groups.find(x=>x.id===b.dataset.id);if(!g)return;
      ui.group=g.id;ui.renaming=false;ui.confirm=null;
      if(g.players.length){S.players=g.players.map(n=>({id:uid(),name:n}));toast('已帶入「'+g.name+'」'+g.players.length+' 人')}
      break;
    }
    case 'addGroup':{const g={id:uid(),name:nextGroupName(),players:[]};S.groups.push(g);ui.group=g.id;ui.renaming=false;break}
    case 'saveGroup':{const g=S.groups.find(x=>x.id===ui.group);if(!g)return;g.players=S.players.map(p=>p.name);toast('已存進「'+g.name+'」');break}
    case 'renameGroup':ui.renaming=true;render();{const i=$('groupName');if(i){i.focus();i.select()}}return;
    case 'cancelRename':ui.renaming=false;break;
    case 'saveRename':{
      const g=S.groups.find(x=>x.id===ui.group);const n=(($('groupName')||{}).value||'').trim().slice(0,12);
      if(!g||!n){toast('名稱不能是空的');return}
      if(S.groups.some(x=>x!==g&&x.name===n)){toast('已經有同名的群組');return}
      g.name=n;ui.renaming=false;break;
    }
    case 'askDelGroup':ui.confirm='delGroup';break;
    case 'delGroup':S.groups=S.groups.filter(x=>x.id!==ui.group);ui.group=null;ui.confirm=null;break;
    case 'addOne':if(S.players.length<MAX_PLAYERS)S.players.push({id:uid(),name:nextDefaultName()});break;
    case 'resetPlayers':S.players=defaults(5);break;
    case 'togPaste':ui.paste=!ui.paste;break;
    case 'importList':{
      let raw=($('pasteBox')||{}).value||'';
      const unlocked=await unlockRoster(raw.trim().toUpperCase());
      if(unlocked)raw=unlocked.join('\n');
      const names=[...new Set(raw.split(/[\n,，、\s]+/).map(s=>s.trim().slice(0,12)).filter(Boolean))].slice(0,MAX_PLAYERS);
      if(names.length<1){toast('沒有讀到名字');return}
      S.players=names.map(n=>({id:uid(),name:n}));ui.paste=false;
      const g=b.dataset.save&&S.groups.find(x=>x.id===ui.group);
      if(g){g.players=names.slice();toast('已帶入 '+names.length+' 人並存進「'+g.name+'」')}else toast('已帶入 '+names.length+' 人');
      break;
    }
    case 'start':if(S.game&&!S.game.done){ui.confirm='replace';break}ui.showWin=true;startGame(S.players.map(p=>p.id));break;
    case 'replaceRecord':case 'replaceDrop':endEarly(a==='replaceRecord');ui.showWin=true;startGame(S.players.map(p=>p.id));render();return;
    case 'make':play('make',+b.dataset.p);return;
    case 'miss':play('miss');return;
    case 'viol':play('viol');return;
    case 'drib':ui.dribble++;if(ui.dribble===S.game.rules.dribbles)speak('收');break;
    case 'dribReset':ui.dribble=0;break;
    case 'undo':ui.showWin=true;undo();return;
    case 'askEnd':ui.confirm='end';break;
    case 'askClear':ui.confirm='clear';break;
    case 'cancel':ui.confirm=null;break;
    case 'abandon':abandon();return;
    case 'clearHist':S.history=[];ui.confirm=null;break;
    case 'rematch':ui.showWin=true;rematch();return;
    case 'toSetup':S.game=null;ui.showWin=true;view='home';break;
    case 'endRecord':endEarly(true);return;
    case 'hideWin':ui.showWin=false;break;
    case 'showWin':ui.showWin=true;break;
    case 'toToday':ui.showWin=false;ui.day=null;view='stats';save();render();window.scrollTo(0,0);return;
    case 'dayNav':{const days=[...new Set(S.history.map(h=>dayKey(h.start)))].sort().reverse();const i=+b.dataset.d;if(days[i])ui.day=days[i];break}
    case 'copyDay':{const d=daySummary(b.dataset.k);if(!d)return;try{await navigator.clipboard.writeText(dayText(d));toast('已複製今日總結')}catch(err){ui.export={csv:dayText(d),count:d.games.length,name:d.key+' 總結',file:'summary.txt'};renderLayer()}return}
    case 'export':{const x=buildExport(b.dataset.kind,b.dataset.id);if(!x.count){toast('還沒有可匯出的紀錄');return}ui.export=x;ui.showWin=false;ui.replay=null;renderLayer();return}
    case 'replay':ui.replay=b.dataset.id;renderLayer();return;
    case 'closeReplay':ui.replay=null;renderLayer();return;
    case 'closeExport':ui.export=null;renderLayer();return;
    case 'expDo':doExport(b.dataset.how);return;
    case 'copy':{
      const txt=S.history.slice(0,20).map(h=>{const s=[...h.players].sort((a,b)=>b.score-a.score);return `${fmtDate(h.start)} 搶${h.rules.target}：`+s.map(p=>`${p.name} ${p.score}`).join('、')+`（${fmtTime(h.end-h.start)}）`}).join('\n');
      try{await navigator.clipboard.writeText('單挑之王戰績\n'+txt);toast('已複製')}catch(err){toast('無法複製，請手動選取')}
      return;
    }
  }
  save();render();
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.classList&&e.target.classList.contains('nm-in'))e.target.blur();
  if(e.target.id==='groupName'){const b=document.querySelector('[data-act="saveRename"]');if(b)b.click()}
});
document.addEventListener('change',e=>{
  if(e.target.dataset&&e.target.dataset.pid){
    const p=S.players.find(x=>x.id===e.target.dataset.pid);if(!p)return;
    const n=e.target.value.trim().slice(0,12);
    if(!n){e.target.value=p.name;return}
    if(S.players.some(x=>x!==p&&x.name===n)){toast('名字重複了');e.target.value=p.name;return}
    p.name=n;save();return;
  }
  if(e.target.id==='customTarget'){const v=parseInt(e.target.value,10);if(v>0&&v<100){S.settings.target=v;save();render()}}
});

if(S.game)view='game';
render();
})();
</script>
